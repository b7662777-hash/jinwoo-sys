name: Publish to Docker Hub

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. 1.0.0)"
        required: true
        type: string
      promote_latest:
        description: "Also tag :latest (only if this is the highest semver)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  prepare:
    name: Resolve Docker release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      promote_latest: ${{ steps.version.outputs.promote_latest }}
      has_dockerhub: ${{ steps.check-secrets.outputs.has_dockerhub }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || '' }}
          fetch-depth: 0

      - name: Check secrets availability
        id: check-secrets
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version and latest promotion
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PROMOTE_INPUT: ${{ inputs.promote_latest }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            PROMOTE="${PROMOTE_INPUT:-false}"
          else
            VERSION="${REF_NAME#v}"
            PROMOTE="true"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "promote_latest=$PROMOTE" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION, promote_latest=$PROMOTE"

  build:
    name: Build Docker (${{ matrix.platform }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    env:
      GHCR_IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || '' }}
          fetch-depth: 0

      - name: Set up QEMU for multi-platform
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (if secrets configured)
        if: needs.prepare.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push base image to GHCR
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner-base
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ env.GHCR_IMAGE_NAME }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max

      - name: Export digests
        env:
          DIGEST_BASE: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/base
          touch "/tmp/digests/base/${DIGEST_BASE#sha256:}"

      - name: Upload base digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-base-${{ matrix.arch }}
          path: /tmp/digests/base/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifests
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE_NAME: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PROMOTE_LATEST: ${{ needs.prepare.outputs.promote_latest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (if secrets configured)
        if: needs.prepare.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download base digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-base-*
          path: /tmp/digests/base
          merge-multiple: true

      - name: Create GHCR manifest
        run: |
          set -euo pipefail
          image="${GHCR_IMAGE_NAME}"
          tags=(-t "${image}:${VERSION}")
          if [ "$PROMOTE_LATEST" = "true" ]; then
            tags+=(-t "${image}:latest")
          fi
          refs=()
          while IFS= read -r digest_file; do
            refs+=("${image}@sha256:$(basename "$digest_file")")
          done < <(find /tmp/digests/base -type f | sort)
          if [ "${#refs[@]}" -eq 0 ]; then
            echo "No image digests in /tmp/digests/base" >&2
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Create Docker Hub manifest (if configured)
        if: needs.prepare.outputs.has_dockerhub == 'true'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          image="${DH_USER}/jinwoo-sys"
          tags=(-t "${image}:${VERSION}")
          if [ "$PROMOTE_LATEST" = "true" ]; then
            tags+=(-t "${image}:latest")
          fi
          refs=()
          while IFS= read -r digest_file; do
            refs+=("${GHCR_IMAGE_NAME}@sha256:$(basename "$digest_file")")
          done < <(find /tmp/digests/base -type f | sort)
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
